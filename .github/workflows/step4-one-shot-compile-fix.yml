name: Step4 one-shot compile fix

on:
  push:
    branches: [ 'step4/archive-media-text-apk-analyzer' ]

permissions:
  contents: write

jobs:
  patch:
    if: "github.event.head_commit.message == 'step4: bootstrap one-shot compile fix v2'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: step4/archive-media-text-apk-analyzer
          fetch-depth: 0
      - name: Apply verified Step 4 compile compatibility fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} occurrence(s), found {actual}: {old!r}")
              p.write_text(text.replace(old, new))

          viewer = 'app/src/main/java/com/zz/filemanager/Step4FileActivity.kt'
          replace_exact(
              viewer,
              'IconButton(onClick = share) { Icon(Icons.Default.Share, contentDescription = "Share") }',
              'IconButton(onClick = { share() }) { Icon(Icons.Default.Share, contentDescription = "Share") }',
          )
          replace_exact(
              viewer,
              'LocalOnBackPressedDispatcherOwner.current?.onBackPressedDispatcher?.onBackPressed()',
              'backDispatcher?.onBackPressed()',
          )

          analyzer = 'app/src/main/java/com/zz/filemanager/core/analyzer/StorageAnalyzer.kt'
          replace_exact(
              analyzer,
              'val children = runCatching { providers.providerFor(location.providerId).listChildren(location) }.getOrElse { continue }',
              '''val children = try {
                  providers.providerFor(location.providerId).listChildren(location)
              } catch (cancelled: kotlinx.coroutines.CancellationException) {
                  throw cancelled
              } catch (_: Throwable) {
                  continue
              }''',
          )

          archive = 'app/src/main/java/com/zz/filemanager/core/archive/ArchiveManager.kt'
          replace_exact(
              archive,
              'ArchiveEntryInfo(path, path.substringAfterLast(\'/\'), entry.isDirectory, entry.compressedSize.takeIf { it >= 0L }, entry.size.takeIf { it >= 0L })',
              'ArchiveEntryInfo(path, path.substringAfterLast(\'/\'), entry.isDirectory, null, entry.size.takeIf { it >= 0L })',
          )
          replace_exact(
              archive,
              'paths.forEach { (entry, _) -> guard.observeHeader(entry.compressedSize.takeIf { it >= 0L }, entry.size.takeIf { it >= 0L }) }',
              '''val totalDeclared = paths.keys.fold(0L) { total, entry ->
                      safeAdd(total, if (entry.isDirectory) 0L else entry.size.coerceAtLeast(0L))
                  }
                  // SevenZArchiveEntry intentionally keeps per-entry compressed size package-private.
                  // Use the whole archive byte size against total declared output for the expansion-ratio
                  // guard, then continue enforcing actual extracted bytes and free-space during writes.
                  guard.observeHeader(request.source.entry.sizeBytes?.takeIf { it > 0L }, totalDeclared)''',
          )
          replace_exact(
              archive,
              'entry.modifiedAtMillis?.takeIf { it > 0L }?.let { modTime = it }',
              'entry.modifiedAtMillis?.takeIf { it > 0L }?.let { setModTime(it) }',
          )

          compat = Path('app/src/main/java/com/zz/filemanager/core/archive/ArchiveCompat.kt')
          if compat.exists():
              raise SystemExit('ArchiveCompat.kt already exists; refusing ambiguous one-shot patch')
          compat.write_text('''package com.zz.filemanager.core.archive\n\n/** Nullable CharArray helper kept local to the archive package; Kotlin has no stdlib isNullOrEmpty for primitive arrays. */\ninternal fun CharArray?.isNullOrEmpty(): Boolean = this == null || this.isEmpty()\n''')
          PY
      - name: Commit patched sources
        shell: bash
        run: |
          git config user.name 'Zubaer Ahmed'
          git config user.email 'zubaerknight@gmail.com'
          git add app/src/main/java/com/zz/filemanager/Step4FileActivity.kt \
                  app/src/main/java/com/zz/filemanager/core/analyzer/StorageAnalyzer.kt \
                  app/src/main/java/com/zz/filemanager/core/archive/ArchiveManager.kt \
                  app/src/main/java/com/zz/filemanager/core/archive/ArchiveCompat.kt
          git diff --cached --check
          git commit -m 'step4: fix Kotlin and archive API compatibility'
          git push origin HEAD:step4/archive-media-text-apk-analyzer
