name: Step4 Transactional Hardening

on:
  push:
    branches:
      - step4/archive-media-text-apk-analyzer
    paths:
      - .github/workflows/step4-transactional-hardening.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: step4/archive-media-text-apk-analyzer
          fetch-depth: 0
      - name: Route archive creation through staged writer
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('app/src/main/java/com/zz/filemanager/core/archive/ArchiveManager.kt')
          text = path.read_text()
          function_start = text.index('    suspend fun create(\n')
          body_start = text.index('        val provider = providers.writableProviderFor(request.destination.providerId)', function_start)
          function_end = text.index('\n    }\n\n    private suspend fun listZip', body_start)

          replacement = '''        val result = safeWriter.writeGenerated(
              parent = request.destination,
              requestedName = request.archiveName,
              mimeType = archiveMime(request.format),
              expectedBytes = null,
              collisionPolicy = CollisionPolicy.KEEP_BOTH,
          ) { raw ->
              when (request.format) {
                  ArchiveFormat.ZIP -> createZip(raw, request, onProgress)
                  ArchiveFormat.TAR, ArchiveFormat.TAR_GZ, ArchiveFormat.TAR_BZ2, ArchiveFormat.TAR_XZ -> createTar(raw, request, onProgress)
                  else -> error("validated above")
              }
          }
          when (result) {
              is com.zz.filemanager.core.step4.SafeWriteResult.Written -> result.entry
              is com.zz.filemanager.core.step4.SafeWriteResult.Skipped ->
                  throw IllegalStateException("Keep Both archive creation unexpectedly skipped output")
          }
'''
          updated = text[:body_start] + replacement + text[function_end:]
          path.write_text(updated)
          PY
          git config user.name 'Zubaer Ahmed'
          git config user.email 'zubaerknight@gmail.com'
          git add app/src/main/java/com/zz/filemanager/core/archive/ArchiveManager.kt
          git commit -m 'step4: stage archive creation before finalization'
          git push origin HEAD:step4/archive-media-text-apk-analyzer
