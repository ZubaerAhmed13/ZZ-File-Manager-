name: Step4 Transactional Hardening

on:
  push:
    branches:
      - step4/archive-media-text-apk-analyzer
    paths:
      - .github/workflows/step4-transactional-hardening.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: step4/archive-media-text-apk-analyzer
          fetch-depth: 0
      - name: Add transactional regression coverage
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path
          path = Path('app/src/androidTest/java/com/zz/filemanager/Step4CoreBehaviorInstrumentationTest.kt')
          text = path.read_text()
          marker = '    @Test\n    fun malformedMediaMetadataFailsGracefullyWithoutThrowing()'
          if marker not in text:
              raise SystemExit('test insertion marker missing')
          if 'freshGeneratedWriteUsesHiddenJournaledStageUntilCommit' in text:
              raise SystemExit('transactional regression tests already present')
          insertion = base64.b64decode('').decode()
          path.write_text(text.replace(marker, insertion + marker, 1))
          PY
          git config user.name 'Zubaer Ahmed'
          git config user.email 'zubaerknight@gmail.com'
          git add app/src/androidTest/java/com/zz/filemanager/Step4CoreBehaviorInstrumentationTest.kt
          git commit -m 'test: cover Step 4 transactional output blockers'
          git push origin HEAD:step4/archive-media-text-apk-analyzer
