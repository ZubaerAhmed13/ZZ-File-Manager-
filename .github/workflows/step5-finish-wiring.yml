name: Step 5 one-shot final wiring

on:
  push:
    branches: [ 'step5/removable-network-cloud' ]
    paths: [ '.github/workflows/step5-finish-wiring.yml' ]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: step5/removable-network-cloud
          fetch-depth: 0
      - name: Apply reviewed wiring patch
        run: python3 tools/step5_finish_wiring.py
      - name: Remove one-shot patch machinery and commit
        run: |
          rm tools/step5_finish_wiring.py .github/workflows/step5-finish-wiring.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "step5: wire discovery settings and resume cleanup"
          git push origin HEAD:step5/removable-network-cloud
