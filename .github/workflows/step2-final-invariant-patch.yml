name: Step 2 final invariant patch

on:
  push:
    paths:
      - '.github/workflows/step2-final-invariant-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: step2/file-operations-engine
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply guarded source repair
        run: python tools/step2_final_invariant_runner.py
      - name: Commit guarded repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/zz/filemanager/core/operation/FileOperationEngine.kt app/src/main/java/com/zz/filemanager/core/operation/ReplaceTransactionCoordinator.kt
          git diff --cached --check
          git commit -m 'fix: prevent unresolved transactions from completing'
          git push origin HEAD:step2/file-operations-engine
