name: Android Step 5 CI

on:
  push:
    branches: [ main, 'step1/**', 'step2/**', 'step3/**', 'step4/**', 'step5/**' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: android-step5-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  certify-step5-api35:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build, unit test, lint, release compile and instrumentation compile
        run: |
          chmod +x ./gradlew
          ./gradlew clean assembleDebug testDebugUnitTest lintDebug assembleRelease assembleDebugAndroidTest --stacktrace
      - name: Enforce Step 5 JVM certification tests and zero skips
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          reports = list(Path('app/build/test-results').rglob('*.xml'))
          if not reports:
              raise SystemExit('No JVM test XML reports were produced.')
          totals = dict(tests=0, failures=0, errors=0, skipped=0)
          seen = set()
          for report in reports:
              root = ET.parse(report).getroot()
              suites = [root] if root.tag == 'testsuite' else list(root.iter('testsuite'))
              for suite in suites:
                  for key in totals:
                      totals[key] += int(suite.attrib.get(key, 0))
              for case in root.iter('testcase'):
                  name = case.attrib.get('name')
                  if name:
                      seen.add(name)
          required = {
              'remoteMoveNeverDeletesSourceBeforeDestinationProven',
              'downloadProcessDeathNeverExposesPartialFinal',
              'uploadProcessDeathNeverExposesPartialRemoteFinal',
              'remoteReplacePreservesKnownGoodDestinationUntilCommitProof',
              'resumeRejectsChangedRemoteRevision',
              'sftpHostKeyChangeBlocksConnection',
              'ftpsCertificateChangeBlocksConnection',
              'usbRemovalDuringMovePreservesSource',
              'networkTimeoutDoesNotDeadlockOperationQueue',
          }
          missing = sorted(required - seen)
          print('STEP5_JVM_TOTALS ' + ' '.join(f'{k}={v}' for k, v in totals.items()))
          if missing:
              raise SystemExit('Missing mandatory Step 5 JVM tests: ' + ', '.join(missing))
          if totals['skipped']:
              raise SystemExit(f"Skipped JVM certification tests detected: {totals['skipped']}")
          PY
      - name: Upload JVM and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jvm-lint-reports
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run API 35 instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            chmod +x ./gradlew
            ./gradlew connectedDebugAndroidTest --stacktrace
      - name: Enforce zero skipped instrumentation tests and print totals
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          reports = list(Path('app/build/outputs/androidTest-results').rglob('*.xml'))
          if not reports:
              raise SystemExit('No instrumentation test XML reports were produced.')
          totals = dict(tests=0, failures=0, errors=0, skipped=0)
          for report in reports:
              root = ET.parse(report).getroot()
              suites = [root] if root.tag == 'testsuite' else list(root.iter('testsuite'))
              for suite in suites:
                  for key in totals:
                      totals[key] += int(suite.attrib.get(key, 0))
          print('STEP5_INSTRUMENTATION_TOTALS ' + ' '.join(f'{k}={v}' for k, v in totals.items()))
          if totals['skipped']:
              raise SystemExit(f"Skipped instrumentation certification tests detected: {totals['skipped']}")
          PY
      - name: Upload instrumentation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumentation-api35-reports
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: ignore
