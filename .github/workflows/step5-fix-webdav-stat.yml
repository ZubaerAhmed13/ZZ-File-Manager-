name: Step 5 one-shot WebDAV stat fix

on:
  push:
    branches: [ 'step5/removable-network-cloud' ]
    paths: [ '.github/workflows/step5-fix-webdav-stat.yml' ]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: step5/removable-network-cloud
          fetch-depth: 0
      - name: Fix WebDAV missing-object stat semantics
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('app/src/main/java/com/zz/filemanager/core/remote/WebDavRemoteFileSystem.kt')
          text = path.read_text()
          pattern = re.compile(
              r'(override fun stat\(path: String\): RemoteNode\? \{.*?return try \{.*?\})\s*catch \(error: DavHttpException\) \{\s*if \(error\.code == 404\) null else throw mapDavError\(error\)\s*\}',
              re.S,
          )
          replacement = r'''\1 catch (error: RemoteAccessException.Protocol) {
              val http = error.cause as? DavHttpException
              if (http?.code == 404) null else throw error
          } catch (error: DavHttpException) {
              if (error.code == 404) null else throw mapDavError(error)
          }'''
          updated, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Expected exactly one WebDAV stat catch block; matched {count}')
          path.write_text(updated)
          PY
      - name: Commit production fix and remove one-shot workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/zz/filemanager/core/remote/WebDavRemoteFileSystem.kt
          git rm .github/workflows/step5-fix-webdav-stat.yml
          git commit -m 'fix(step5): return null for missing WebDAV stat targets'
          git push origin HEAD:step5/removable-network-cloud
