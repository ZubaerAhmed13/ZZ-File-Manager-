name: Step4 Final Three Fixes

on:
  push:
    branches:
      - step4/archive-media-text-apk-analyzer
    paths:
      - .github/workflows/step4-final-three-fixes.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: step4/archive-media-text-apk-analyzer
          fetch-depth: 0
      - name: Apply exact Step 4 fixes
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path

          def dec(value):
              return base64.b64decode(value).decode()

          activity = Path('app/src/main/java/com/zz/filemanager/Step4FileActivity.kt')
          text = activity.read_text()

          old_toolbar = dec('')
          new_toolbar = dec('')
          if text.count(old_toolbar) != 1:
              raise SystemExit(f'editor toolbar exact match count was {text.count(old_toolbar)}, expected 1')
          text = text.replace(old_toolbar, new_toolbar, 1)

          start_marker = '                Button(onClick = {\n                    if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O && !context.packageManager.canRequestPackageInstalls()) {'
          end_marker = '                Text("Installation is always explicit and confirmed by Android. APK inspection never executes application code.", style = MaterialTheme.typography.bodySmall)\n'
          if text.count(start_marker) != 1:
              raise SystemExit(f'APK install start marker count was {text.count(start_marker)}, expected 1')
          if text.count(end_marker) != 1:
              raise SystemExit(f'APK install end marker count was {text.count(end_marker)}, expected 1')
          start = text.index(start_marker)
          end = text.index(end_marker, start) + len(end_marker)
          install_block = text[start:end]
          text = text[:start] + text[end:]

          anchor = '                Property("Installed", if (meta.installed) "Yes" else "No")\n'
          if text.count(anchor) != 1:
              raise SystemExit(f'APK primary-facts anchor count was {text.count(anchor)}, expected 1')
          insert = anchor + '                // Keep the explicit install action with the primary APK facts instead of below long permission lists.\n' + install_block
          text = text.replace(anchor, insert, 1)
          if text.count('Text("Install with Android Package Installer")') != 1:
              raise SystemExit('APK install action must exist exactly once after move')
          activity.write_text(text)

          apk = Path('app/src/main/java/com/zz/filemanager/core/apk/ApkManager.kt')
          apk_text = apk.read_text()
          needle = 'joinToString(":")'
          if apk_text.count(needle) != 2:
              raise SystemExit(f'colon-delimited SHA-256 formatter count was {apk_text.count(needle)}, expected 2')
          apk_text = apk_text.replace(needle, 'joinToString("")')
          if needle in apk_text:
              raise SystemExit('colon-delimited SHA-256 formatter remains')
          apk.write_text(apk_text)
          PY
          git diff --check
          git diff -- app/src/main/java/com/zz/filemanager/Step4FileActivity.kt app/src/main/java/com/zz/filemanager/core/apk/ApkManager.kt
          git config user.name "Zubaer Ahmed"
          git config user.email "zubaerknight@gmail.com"
          git add app/src/main/java/com/zz/filemanager/Step4FileActivity.kt app/src/main/java/com/zz/filemanager/core/apk/ApkManager.kt
          git commit -m "step4: fix final API 35 UI and APK contracts"
          git push origin HEAD:step4/archive-media-text-apk-analyzer
