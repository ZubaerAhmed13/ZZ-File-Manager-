name: Step4 Final Three Fixes

on:
  push:
    branches:
      - step4/archive-media-text-apk-analyzer
    paths:
      - .github/workflows/step4-final-three-fixes.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: step4/archive-media-text-apk-analyzer
          fetch-depth: 0
      - name: Apply exact Step 4 fixes
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path

          def dec(value):
              return base64.b64decode(value).decode()

          activity = Path('app/src/main/java/com/zz/filemanager/Step4FileActivity.kt')
          text = activity.read_text()
          old_toolbar = dec('')
          new_toolbar = dec('')
          install = dec('')
          anchor = dec('ICAgICAgICAgICAgICAgIFByb3BlcnR5KCJJbnN0YWxsZWQiLCBpZiAobWV0YS5pbnN0YWxsZWQpICJZZXMiIGVsc2UgIk5vIikKICAgICAgICAgICAgICAgIEhvcml6b250YWxEaXZpZGVyKCkK')
          new_anchor = dec('')
          for old, new, label in [(old_toolbar, new_toolbar, 'editor toolbar'), (anchor, new_anchor, 'APK action anchor')]:
              if text.count(old) != 1:
                  raise SystemExit(f'{label} exact match count was {text.count(old)}, expected 1')
              text = text.replace(old, new, 1)
          if text.count(install) != 2:
              raise SystemExit(f'APK install block count after insertion was {text.count(install)}, expected 2')
          # Remove the original lower copy, preserving the newly inserted upper copy.
          first = text.find(install)
          second = text.find(install, first + len(install))
          text = text[:second] + text[second + len(install):]
          activity.write_text(text)

          apk = Path('app/src/main/java/com/zz/filemanager/core/apk/ApkManager.kt')
          text = apk.read_text()
          pairs = [
              (dec('ICAgICAgICAgICAgc2hhMjU2ID0gTWVzc2FnZURpZ2VzdC5nZXRJbnN0YW5jZSgiU0hBLTI1NiIpLmRpZ2VzdChieXRlcykuam9pblRvU3RyaW5nKCI6IikgeyAiJTAyWCIuZm9ybWF0KGl0KSB9LA=='), dec('ICAgICAgICAgICAgc2hhMjU2ID0gTWVzc2FnZURpZ2VzdC5nZXRJbnN0YW5jZSgiU0hBLTI1NiIpLmRpZ2VzdChieXRlcykuam9pblRvU3RyaW5nKCIiKSB7ICIlMDJYIi5mb3JtYXQoaXQpIH0s')),
              (dec('ICAgICAgICBydW5DYXRjaGluZyB7IEFwa0NlcnRpZmljYXRlKE1lc3NhZ2VEaWdlc3QuZ2V0SW5zdGFuY2UoIlNIQS0yNTYiKS5kaWdlc3QoYnl0ZXMpLmpvaW5Ub1N0cmluZygiOiIpIHsgYiAtPiAiJTAyWCIuZm9ybWF0KGIpIH0sIG51bGwsIG51bGwpIH0uZ2V0T3JOdWxsKCk='), dec('ICAgICAgICBydW5DYXRjaGluZyB7IEFwa0NlcnRpZmljYXRlKE1lc3NhZ2VEaWdlc3QuZ2V0SW5zdGFuY2UoIlNIQS0yNTYiKS5kaWdlc3QoYnl0ZXMpLmpvaW5Ub1N0cmluZygiIikgeyBiIC0+ICIlMDJYIi5mb3JtYXQoYikgfSwgbnVsbCwgbnVsbCkgfS5nZXRPck51bGwoKQ==')),
          ]
          for old, new in pairs:
              if text.count(old) != 1:
                  raise SystemExit(f'digest exact match count was {text.count(old)}, expected 1')
              text = text.replace(old, new, 1)
          apk.write_text(text)
          PY
          git diff --check
          git diff -- app/src/main/java/com/zz/filemanager/Step4FileActivity.kt app/src/main/java/com/zz/filemanager/core/apk/ApkManager.kt
          git config user.name "Zubaer Ahmed"
          git config user.email "zubaerknight@gmail.com"
          git add app/src/main/java/com/zz/filemanager/Step4FileActivity.kt app/src/main/java/com/zz/filemanager/core/apk/ApkManager.kt
          git commit -m "step4: fix final API 35 UI and APK contracts"
          git push origin HEAD:step4/archive-media-text-apk-analyzer
